[package]
name = "ergo-monitor"
version = "0.1.0"
edition = "2021"
description = "Ergo node + wallet monitor with Discord alerts and a status dashboard"
license-file = "LICENSE"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
