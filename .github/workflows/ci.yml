name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: fmt + clippy + tests
        run: docker build --target test --progress plain .
      - name: runtime image builds
        run: docker build -t ergo-monitor .
